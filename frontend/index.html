<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nexus — Offline AI</title>
    <meta name="description"
      content="Offline multimodal RAG intelligence. Query documents, images, and audio locally." />

    <!-- favicon SVG inline -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><path d='M50 20L22 35l28 15 28-15L50 20zM22 65l28 15 28-15M22 50l28 15 28-15' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />

    <!-- preconnect fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* prevent flash of unstyled content */
      html { background: #08090e; }
      body { margin: 0; }

      /* splash loader */
      #splash {
        position: fixed;
        inset: 0;
        background: #08090e;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity .4s ease;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(99,102,241,.4);
        animation: splash-pulse 1.2s ease infinite;
      }
      @keyframes splash-pulse {
        0%,100% { box-shadow: 0 0 40px rgba(99,102,241,.4); transform: scale(1); }
        50%      { box-shadow: 0 0 60px rgba(99,102,241,.6); transform: scale(1.04); }
      }
    </style>
  </head>

  <body>
    <!-- splash -->
    <div id="splash">
      <div class="splash-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path
            d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
            stroke="white" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"
          />
        </svg>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      /* hide splash once React mounts */
      window.__hideSplash = function() {
        const s = document.getElementById("splash")
        if (s) {
          s.classList.add("hidden")
          setTimeout(() => s.remove(), 500)
        }
      }
    </script>
  </body>
</html>
